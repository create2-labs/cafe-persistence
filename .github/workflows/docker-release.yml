# Promote RC image sha-<SHORT_SHA> to version tag (no rebuild).

name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version and SHA from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          FULL_SHA=$(git rev-list -n 1 "$TAG")
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          echo "full_version=$TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Release version: $TAG"
          echo "Commit SHA (for promotion): $SHORT_SHA"

      - name: Promote cafe-persistence image
        run: |
          SRC="oleglod/cafe-persistence:sha-${{ steps.version.outputs.short_sha }}"
          TAG="${{ steps.version.outputs.full_version }}"
          docker buildx imagetools create \
            -t "oleglod/cafe-persistence:${TAG}" \
            -t "oleglod/cafe-persistence:latest" \
            "$SRC"
