openapi: 3.0.3
info:
  title: CAFE Persistence — internal crypto policy (CP) API
  version: "1.1.0"
  license:
    name: Proprietary
    url: https://example.com/license
  description: |
    **PERS-D3b-spec / RD-P3** — service-to-service contract for durable crypto policy storage in
    `cafe-persistence`. **Semantic ownership** of CP data (columns, statuses, payload shape,
    W1 uniqueness) is **CPM** + [ADR_20260824_remove_cp_drafts](https://github.com/create2-labs/cafe-adr/blob/main/ADR_20260824_remove_cp_drafts.md);
    cafe-persistence owns DDL, migrations, and writers.

    **Consumers:**
    - `cafe-crypto-policy-mgt` — `POST /policies` after public signed persist (RD-P5+), plus GET/DELETE/list
    - `cafe-discovery` — existence-only references for W1 / W3 immutability guards

    **Breaking (RD-P3):** draft tables and `/drafts*` internal routes are **removed** (no dual-run).
    Old CPM draft clients against this schema **fail** intentionally; RAZ of test policies is authorized.

    **URL prefix (in-cluster):** `/internal/cp/v1` on the persistence internal HTTP listener
    (`PERSISTENCE_INTERNAL_HTTP_PORT`, default `8082`, shared with `internal/scan/v1`).
    **Not** exposed on the public product edge / NGINX.

    **Auth:** static platform bearer token (`CAFE_PERSISTENCE_SERVICE_TOKEN`). Callers derive
    `user_id` / `tenant_id` from the end-user JWT and propagate them via headers — **never** from
    an untrusted client body. See ADR persistence §9.2.

    **Wallet authorization boundary:** EIP-191 / `personal_sign` verification stays in CPM on the
    public `POST /api/cpm/v1/policies` route. The internal `CreatePolicy` operation accepts
    **pre-verified** wallet metadata + server `payload_sha256` only; raw `signature` /
    `signed_message` bytes are **not** stored in Postgres.

    **W1 idempotence:** unique partial index on active policies
    `(user_id, wallet_address) WHERE status = 'persisted' AND deleted_at IS NULL`.
    Duplicate create → **409** `POLICY_ALREADY_EXISTS`. Replace = DELETE then new create (NB1).

    **Postgres table:** `crypto_policies` only (draft tables dropped).

servers:
  - url: http://cafe-persistence:{internal_port}/internal/cp/v1
    description: Docker / K8s service mesh (not public edge).
    variables:
      internal_port:
        default: "8082"
        description: "PERSISTENCE_INTERNAL_HTTP_PORT (distinct from health port 8081)."

tags:
  - name: policies
    description: Owner-scoped persisted policies (`crypto_policies`, status `persisted`).
  - name: references
    description: Existence / count facts for Discovery W1 and W3 — no policy payload (ADR §9.3).

security:
  - serviceBearer: []

paths:
  /policies:
    post:
      tags: [policies]
      summary: Create persisted crypto policy
      description: |
        Creates one `crypto_policies` row after CPM verified wallet control and computed
        `payload_sha256`. Idempotence / conflict is **W1** unique (409), not draft-based.
        Client-supplied `payload_sha256` inside `payload` JSON is stripped; the column from
        the request body is the stored authority (CPM is the only trusted caller).
      operationId: createPolicy
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Active policy already exists for owner + wallet (W1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpErrorResponse"
              example:
                error: POLICY_ALREADY_EXISTS
                message: An active crypto policy already exists for this wallet.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [policies]
      summary: List persisted policies for a scan
      description: |
        Owner-scoped list of **persisted** policies referencing `scan_id`.
        Newest `persisted_at` first.
      operationId: listPoliciesByScan
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: scan_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated policy rows for scan_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPolicyRows"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /policies/{policy_id}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      tags: [policies]
      summary: Get owner persisted policy by policy_id
      operationId: getPolicy
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Persisted policy row (status persisted, not soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRow"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [policies]
      summary: Soft-delete owner persisted policy
      description: |
        Sets `deleted_at` on the policy row. Frees the W1 unique slot so a new create can succeed (NB1).
      operationId: deletePolicy
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "204":
          description: Policy soft-deleted.
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /references/wallet:
    get:
      tags: [references]
      summary: Count active CP context for a wallet target (W1)
      description: |
        Existence facts for Discovery **W1** guard on `POST /scan`. Returns count of
        persisted policies for the normalized wallet address — **no policy payload**,
        **no draft_count** (drafts removed).
      operationId: countPoliciesByWallet
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: wallet_address
          in: query
          required: true
          schema:
            type: string
          description: Normalized EVM address (0x plus 40 lowercase hex).
      responses:
        "200":
          description: Wallet reference counts for owner scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletReferenceCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /references/scan:
    get:
      tags: [references]
      summary: Count persisted policies referencing a scan (W3)
      description: |
        Existence facts for Discovery **W3** guard on scan DELETE. Counts only
        **persisted** policies (`status=persisted`, not soft-deleted).
      operationId: countPoliciesByScan
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: scan_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan reference counts for owner scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReferenceCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: |
        Platform service token (`CAFE_PERSISTENCE_SERVICE_TOKEN`). Constant-time comparison
        on the server. Same scheme as `internal/scan/v1`.

  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: End-user owner id derived from the caller's validated JWT.
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional tenant scope propagated from the caller.
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Correlation id echoed on error responses when provided.
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CpErrorResponse"
    Forbidden:
      description: Owner scope mismatch (callers may map to 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CpErrorResponse"
          example:
            error: FORBIDDEN
            message: Resource is not accessible for the scoped owner.
    PolicyNotFound:
      description: Policy not found for scoped owner.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CpErrorResponse"
          example:
            error: POLICY_NOT_FOUND
            message: Policy not found.
    ServiceUnauthorized:
      description: Missing or invalid service bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceAuthError"
    ServiceUnavailable:
      description: Persistence data plane temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CpErrorResponse"
          example:
            error: PERSISTENCE_UNAVAILABLE
            message: Persistence is temporarily unavailable.

  schemas:
    PolicyStatus:
      type: string
      enum: [persisted]
      description: |
        `persisted` — active durable CP row. Replacement uses soft-delete then a new create (NB1).

    CpErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - POLICY_NOT_FOUND
            - POLICY_ALREADY_EXISTS
            - FORBIDDEN
            - PERSISTENCE_UNAVAILABLE
            - INVALID_WALLET_ADDRESS
            - INVALID_REQUEST
        message:
          type: string

    ServiceAuthError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [service_auth_required]
        message:
          type: string

    CreatePolicyRequest:
      type: object
      required:
        - scan_id
        - wallet_address
        - chain_id
        - payload
        - payload_sha256
        - wallet_control_verified_at
      additionalProperties: false
      description: |
        Pre-verified create from CPM after public wallet-auth + payload hash. Maps to
        `cpstore.CreatePolicyInput`. Must not include raw `signature` / `signed_message`.
      properties:
        scan_id:
          type: string
          format: uuid
        wallet_address:
          type: string
          description: Normalized EOA address (0x plus lowercase hex).
        chain_id:
          type: integer
          format: int64
          minimum: 1
        payload:
          type: object
          additionalProperties: true
          description: Policy JSON (signature fields stripped on write).
        payload_sha256:
          type: string
          description: Hex SHA-256 of JCS-canonical hashed subtree (CPM server authority).
          minLength: 64
          maxLength: 64
        signed_message_hash:
          type: string
          description: Hash of the verified canonical message (no raw message stored).
        wallet_control_method:
          type: string
          enum: [eoa_signature]
          default: eoa_signature
        wallet_control_verified_at:
          type: string
          format: date-time
        challenge_issued_at:
          type: string
          format: date-time
          description: Derived from verified signed message window (stateless challenges).
        challenge_expires_at:
          type: string
          format: date-time

    CreatePolicyResponse:
      type: object
      required:
        - policy_id
        - scan_id
        - wallet_address
        - chain_id
        - payload_sha256
        - status
        - ownership_status
        - wallet_control_method
        - persisted_at
      properties:
        policy_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        wallet_address:
          type: string
        chain_id:
          type: integer
          format: int64
        payload_sha256:
          type: string
        status:
          type: string
          enum: [persisted]
        ownership_status:
          type: string
          enum: [verified]
        wallet_control_method:
          type: string
          enum: [eoa_signature]
        persisted_at:
          type: string
          format: date-time

    PolicyRow:
      type: object
      required:
        - id
        - user_id
        - scan_id
        - wallet_address
        - chain_id
        - payload
        - payload_sha256
        - status
        - persisted_at
        - created_at
        - updated_at
      description: Persistence projection of crypto_policies (active row).
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        scan_id:
          type: string
          format: uuid
        wallet_address:
          type: string
          description: Normalized address; W1 unique with user_id when active.
        chain_id:
          type: integer
          format: int64
        payload:
          type: object
          additionalProperties: true
          description: |
            Normalized policy JSON. Immutable after create; `signed_message` and `signature`
            are never stored. Client `payload_sha256` inside JSON is stripped.
        payload_sha256:
          type: string
          description: Server-stored payload fingerprint for GET reconciliation after 409.
        signed_message_hash:
          type: string
        ownership_status:
          type: string
          example: verified
        wallet_control_method:
          type: string
          example: eoa_signature
        wallet_control_verified_at:
          type: string
          format: date-time
        challenge_issued_at:
          type: string
          format: date-time
        challenge_expires_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PolicyStatus"
        persisted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedPolicyRows:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PolicyRow"

    PaginationEnvelope:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    WalletReferenceCount:
      type: object
      required: [exists, policy_count]
      description: |
        W1 existence facts. `exists` is true when `policy_count > 0`. No draft fields.
      properties:
        exists:
          type: boolean
        policy_count:
          type: integer
          minimum: 0
          description: Persisted policies referencing the wallet target.

    ScanReferenceCount:
      type: object
      required: [referenced, count]
      description: |
        W3 existence facts. `referenced` is true when `count > 0` for persisted policies bound
        to `scan_id`.
      properties:
        referenced:
          type: boolean
        count:
          type: integer
          minimum: 0
